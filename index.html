<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./src/favicon.ico" type="image/x-icon">
    <title data-i18n="app.title">CipherFlow — Нодовый шифратор</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/easter-egg-styles.css">
</head>
<body class="theme-dark">
    <div class="app">
        <header class="topbar">
            <button class="icon-btn palette-btn" id="paletteBtn" type="button" data-i18n-title="nodes.title" title="Ноды шифрования">
                <i class="fas fa-plus"></i>
            </button>
            <div class="brand" title="F1">
                <img class="brand-logo" src="./src/favicon.ico" alt="">
                <span>CipherFlow</span>
            </div>

            <label class="mode-switch" for="modeSwitch">
                <input type="checkbox" id="modeSwitch">
                <span class="mode-option mode-encrypt"><i class="fas fa-lock"></i><span data-i18n="header.encryption">Шифрование</span></span>
                <span class="mode-option mode-decrypt"><i class="fas fa-unlock"></i><span data-i18n="header.decryption">Расшифровка</span></span>
            </label>

            <div class="topbar-actions">
                <button class="btn" id="loadBtn" type="button">
                    <i class="fas fa-folder-open"></i><span data-i18n="header.load_scheme">Загрузить схему</span>
                </button>
                <button class="btn" id="saveBtn" type="button">
                    <i class="fas fa-save"></i><span data-i18n="header.save_scheme">Сохранить схему</span>
                </button>
                <button class="btn btn-quiet-danger" id="clearBtn" type="button">
                    <i class="fas fa-trash"></i><span data-i18n="header.clear">Очистить</span>
                </button>
                <span class="topbar-divider"></span>
                <button class="icon-btn help-btn" type="button" data-i18n-title="header.help" title="Справка (F1)">
                    <i class="fas fa-question-circle"></i>
                </button>
                <button class="icon-btn settings-btn" type="button" data-i18n-title="header.settings" title="Настройки">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <div class="main-content">
            <aside class="nodes-panel">
                <h3 data-i18n="nodes.title">Ноды шифрования</h3>
                <div class="node-categories"></div>
            </aside>

            <main class="workspace">
                <div class="canvas-controls">
                    <button class="canvas-control-btn" id="zoomInBtn" type="button" data-i18n-title="canvas.zoom_in" title="Увеличить"><i class="fas fa-plus"></i></button>
                    <button class="canvas-control-btn" id="zoomOutBtn" type="button" data-i18n-title="canvas.zoom_out" title="Уменьшить"><i class="fas fa-minus"></i></button>
                    <button class="canvas-control-btn" id="resetZoomBtn" type="button" data-i18n-title="canvas.zoom_reset" title="Сбросить масштаб"><i class="fas fa-compress"></i></button>
                    <span class="zoom-level" id="zoomLevel">100%</span>
                    <span class="canvas-controls-divider"></span>
                    <button class="canvas-control-btn" id="scissorBtn" type="button" data-i18n-title="canvas.cut_mode_tooltip" title="Режим ножниц (X)"><i class="fas fa-cut"></i></button>
                </div>
                <div class="canvas" id="canvas">
                    <div class="canvas-background"></div>
                    <svg class="connections-layer" id="connections"></svg>
                    <div class="nodes-layer" id="nodesLayer"></div>
                </div>
            </main>
        </div>

        <footer class="io-panel">
            <div class="io-section" id="inputSection">
                <label for="inputText" id="inputLabel" data-i18n="io.input_label">Входной текст</label>
                <textarea id="inputText" spellcheck="false" data-i18n-placeholder="io.input_placeholder" placeholder="Введите текст для шифрования..."></textarea>
                <div class="io-notice" hidden>
                    <i class="fas fa-info-circle"></i><span></span>
                    <button type="button" class="btn btn-small io-copy-full"></button>
                    <button type="button" class="btn btn-small io-download-full"></button>
                </div>
            </div>
            <div class="io-section" id="outputSection">
                <label for="outputText" id="outputLabel" data-i18n="io.output_label">Результат</label>
                <textarea id="outputText" spellcheck="false" readonly data-i18n-placeholder="io.output_placeholder" placeholder="Результат появится здесь..."></textarea>
                <div class="io-notice" hidden>
                    <i class="fas fa-info-circle"></i><span></span>
                    <button type="button" class="btn btn-small io-copy-full"></button>
                    <button type="button" class="btn btn-small io-download-full"></button>
                </div>
            </div>
        </footer>
    </div>

    <input type="file" id="fileInput" accept=".json" hidden>

    <!-- core -->
    <script src="js/core/modules.js"></script>
    <script src="js/core/i18n.js"></script>
    <script src="js/core/text-utils.js"></script>
    <script src="js/core/morse.js"></script>
    <script src="js/core/node-registry.js"></script>
    <!-- node definitions: one file per category -->
    <script src="js/nodes/io.js"></script>
    <script src="js/nodes/classic.js"></script>
    <script src="js/nodes/transform.js"></script>
    <script src="js/nodes/planet-enchanter.js"></script>
    <script src="js/nodes/compression.js"></script>
    <script src="js/nodes/advanced.js"></script>
    <script src="js/nodes/logic.js"></script>
    <script src="js/nodes/modern.js"></script>
    <script src="js/nodes/fun.js"></script>
    <script src="js/nodes/system.js"></script>
    <!-- application -->
    <script src="js/app/executor.js"></script>
    <script src="js/app/scheme.js"></script>
    <script src="js/app/examples.js"></script>
    <script src="js/app/ui.js"></script>
    <script src="js/app/io-panel.js"></script>
    <script src="js/app/canvas-manager.js"></script>
    <script src="js/app/node-manager.js"></script>
    <script src="js/app/connection-manager.js"></script>
    <script src="js/app/selection-manager.js"></script>
    <script src="js/app/history-manager.js"></script>
    <script src="js/app/engine-worker.js"></script>
    <script src="js/app/cipher-engine.js"></script>
    <script src="js/app/file-manager.js"></script>
    <script src="js/app/node-panel.js"></script>
    <script src="js/app/help-system.js"></script>
    <script src="js/app/settings-system.js"></script>
    <script src="js/app/shortcuts.js"></script>
    <script src="js/app/easter-eggs.js"></script>
    <script src="js/app/main.js"></script>
</body>
</html>
